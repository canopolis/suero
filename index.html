<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de Dosis para Perros</title>
<style>
    * { box-sizing: border-box; }
    html { font-size: clamp(18px, 1.2vw + 14px, 24px); }
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: clamp(12px, 3vw, 40px);
    }
    .container {
        background: white;
        padding: clamp(20px, 4vw, 48px);
        border-radius: 16px;
        box-shadow: 0 0 15px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 760px;
        margin: clamp(0px, 3vh, 40px) auto 0;
        text-align: center;
    }
    h2 {
        font-size: clamp(1.6rem, 3vw, 2.2rem);
        margin: 0 0 0.5em;
    }
    input {
        padding: 0.8em;
        width: 100%;
        margin: 0.8em 0;
        border-radius: 10px;
        border: 2px solid #ccc;
        font-size: 1.15rem;
    }
    button {
        padding: 0.8em;
        width: 100%;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1.25rem;
        font-weight: bold;
    }
    button:hover {
        background-color: #45a049;
    }
    .resultado {
        margin-top: 1.2em;
        text-align: left;
        font-size: 1rem;
        line-height: 1.5;
    }
    .resultado p { margin: 0.6em 0; }
</style>
</head>
<body>

<div class="container">
    <h2>Calculadora de Dosis</h2>
    <input type="number" id="peso" placeholder="Peso del perro en kg" step="0.1" inputmode="decimal">
    <button onclick="calcularDosis()">Calcular</button>

    <div class="resultado" id="resultado"></div>
</div>

<script>
function calcularDosis() {
    const peso = parseFloat(document.getElementById("peso").value);

    if (isNaN(peso) || peso <= 0) {
        document.getElementById("resultado").innerHTML = "Por favor ingresa un peso válido.";
        return;
    }

    const dosisPorAplicacion = peso * 0.50;
    const dosisDiaria = dosisPorAplicacion * 2;
    const dosisTotal5Dias = dosisDiaria * 5;
    const frascosNecesarios = Math.ceil(dosisTotal5Dias / 6);

    document.getElementById("resultado").innerHTML = `
        <p><b>Dosis por una aplicación:</b> ${dosisPorAplicacion.toFixed(2)} ml</p>
        <p><b>Dosis diaria:</b> ${dosisDiaria.toFixed(2)} ml (se multiplica la dosis por aplicación por dos porque se inyecta dos veces al día)</p>
        <p><b>Dosis total en 5 días:</b> ${dosisTotal5Dias.toFixed(2)} ml</p>
        <p><b>Frascos necesarios:</b> ${frascosNecesarios}</p>
        <p>Este cálculo es para un solo perro</p>
    `;
}
</script>

</body>
</html>
